[versionannotations]
# keep this alphabetical please
cryptography =
    Since version 49 there are no wheels for x86_64 (Intel) macOS, only arm64.
    On Intel Macs pip builds it from source, which needs Rust and OpenSSL.
    In Plone core it is not installed, only via optional tooling.
grpcio =
   This has an exact version pin in the robotframework-browser package.
grpcio-tools =
   This has an exact version pin in the robotframework-browser package.
lxml =
    Keep lxml at 5.x for Plone 6.0.  Note that lxml 6.1.0 has a security fix
    (CVE-2026-41066): in lxml 5, iterparse() and ETCompatXMLParser() still
    resolve external entities by default, so untrusted XML can read local files.
    Plone core does not use those on untrusted XML, so it is not affected.
lxml-html-clean =
    Versions 0.4.5 and higher have a security fix, but need lxml 6.1.1 or higher.
    The fix (CVE-2026-49825) is about javascript: URLs in xlink:href when using
    Cleaner(safe_attrs_only=False).  The safe_html transform of
    Products.PortalTransforms is not affected: it uses safe_attrs_only=True and
    already removes attributes with script: or data: in their value.
protobuf =
   This has an exact version pin in the robotframework-browser package.
selenium =
    robotframework-seleniumlibrary 6.1.0 is incompatible with 4.10.0. See https://github.com/robotframework/SeleniumLibrary/issues/1835
docutils =
    On python39 Zope pins docutils to 0.20.1 because Sphinx <8 requires docutils <0.21 (and Spinx 8 requires Python 3.10+).
    But we pull in readme-renderer>=35.0 which depends on docutils>=0.21.2.
