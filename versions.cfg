   This has an exact version pin in the robotframework-browser package.
grpcio-tools =
   This has an exact version pin in the robotframework-browser package.
Products.CMFCore =
    Products.CMFCore 3.9 gives test failures in Products.CMFPlone/CMFEditions and plone.app.portlets.
prompt-toolkit =
    Requirement of robotframework-debuglibrary: prompt-toolkit<3,>=2
protobuf =
   This has an exact version pin in the robotframework-browser package.
readme-renderer =
   readme-renderer 45 switches from cmarkgfm to comrak, which is missing some wheels for Mac
selenium =
    robotframework-seleniumlibrary 6.1.0 is incompatible with 4.10.0. See https://github.com/robotframework/SeleniumLibrary/issues/1835
