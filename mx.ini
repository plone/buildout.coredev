[settings]
threads = 5

# With an empty 'requirements-in' mxdev only generates a list of checkouts:
# '-e src/Plone', etc.  That can be nice.
# General problem though: if you have '-e src/Plone' in the requirements-out,
# then all dependencies of the Plone will get installed, even if you would
# only want Products.CMFPlone and its dependencies.  We may tackle this later.
# For now, let's basically require everything we could ever want,
# especially all test dependencies.
requirements-in = requirements-test.txt
requirements-out = requirements-mxdev.txt
default-target = src
include =
    mxsources.ini
    mxcheckouts.ini
    mxtests.ini
version-overrides =
# You MUST manually keep this in sync with the OVERRIDES in versions.cfg
    certifi==2026.10.19
    mr.developer==3.0.0
    msgpack==1.2.4
    Products.ZCatalog==7.4
    RestrictedPython==8.5
    urllib3==2.8.0
    zc.recipe.testrunner==4.2.post1
# Extra overrides for specific Python versions.
# mxdev keeps one override per name, but the name is case sensitive there,
# so we use a different spelling to keep the original Zope pin on Python 3.10.
    filelock==4.2.8; python_version > "3.10"
    FileLock==3.32.2; python_version == "3.10"

# mxmake related mxdev extensions
mxmake-test-runner = zope-testrunner

# templates to generate
mxmake-templates =
    run-tests
    plone-site

# environment variables
[mxmake-env]
# VAR = value

[mxmake-run-tests]
environment = env

[mxmake-plone-site]
distribution = volto
extension_ids = plone.volto:default
