[buildout]
extends =
    core.cfg
    versions-ecosystem.cfg

# auto-checkout +=
#     plone.app.mosaic

custom-eggs +=
    collective.z3cform.datagridfield
# Not Py3 compatible:
#    collective.z3cform.datetimewidget
    plone.app.debugtoolbar
    plone.app.blocks
    plone.app.drafts
    plone.app.mosaic
    plone.app.standardtiles
# Not Zope 5 compatible:
#    plone.formwidget.autocomplete
#    plone.formwidget.contenttree
# Still has Archetypes code, and requires unittest2:
#    plone.formwidget.datetime
    plone.jsonserializer
    Products.PDBDebugMode
    Products.PrintingMailHost
    z3c.jbot
    z3c.unconfigure

test-eggs =
# Let's only test our custom eggs.
    ${:custom-eggs}
    collective.z3cform.datagridfield[test]
    plone.app.mosaic[test]

[sources]
plone.app.drafts                    = git ${remotes:plone}/plone.app.drafts.git pushurl=${remotes:plone_push}/plone.app.drafts.git branch=2.x
plone.app.blocks                    = git ${remotes:plone}/plone.app.blocks.git pushurl=${remotes:plone_push}/plone.app.blocks.git branch=7.x
plone.app.mosaic                    = git ${remotes:plone}/plone.app.mosaic.git pushurl=${remotes:plone_push}/plone.app.mosaic.git branch=3.x
plone.app.standardtiles              = git ${remotes:plone}/plone.app.standardtiles.git pushurl=${remotes:plone_push}/plone.app.standardtiles.git branch=3.x
collective.z3cform.datagridfield    = git ${remotes:collective}/collective.z3cform.datagridfield.git pushurl=${remotes:collective_push}/collective.z3cform.datagridfield.git branch=3.x
plone.app.debugtoolbar              = git ${remotes:plone}/plone.app.debugtoolbar.git pushurl=${remotes:plone_push}/plone.app.debugtoolbar.git branch=1.x
Products.PDBDebugMode               = git ${remotes:collective}/Products.PDBDebugMode.git pushurl=${remotes:collective_push}/Products.PDBDebugMode.git branch=2.x
