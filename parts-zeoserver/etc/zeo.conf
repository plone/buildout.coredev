%define INSTANCE /Users/maurits/community/plone-coredev/6.1/parts/zeoserver

<zeo>
  address 127.0.0.1:8100
  read-only false
  invalidation-queue-size 100
  pid-filename /Users/maurits/community/plone-coredev/6.1/var/zeoserver.pid
  
  
</zeo>

<filestorage 1>
  path /Users/maurits/community/plone-coredev/6.1/var/filestorage/Data.fs
  blob-dir /Users/maurits/community/plone-coredev/6.1/var/blobstorage
  
  
</filestorage>

<eventlog>
  level info
  <logfile>
      path /Users/maurits/community/plone-coredev/6.1/var/log/zeoserver.log
      format %(asctime)s %(message)s
      
    </logfile>
</eventlog>

<runner>
  program $INSTANCE/bin/runzeo
  socket-name /Users/maurits/community/plone-coredev/6.1/var/zeo.zdsock
  daemon true
  forever false
  backoff-limit 10
  exit-codes 0, 2
  directory $INSTANCE
  default-to-interactive true
  

  # This logfile should match the one in the zeo.conf file.
  # It is used by zdctl's logtail command, zdrun/zdctl doesn't write it.
  logfile /Users/maurits/community/plone-coredev/6.1/var/log/zeoserver.log
</runner>


