name: Run full test suite 3.14

on: push

jobs:
  testall:
    runs-on: ubuntu-latest
    env:
        PYTHONWARNINGS: ignore
        GIT_CLONE_DEPTH: 1
        CHAMELEON_CACHE: 'chameleon_cache'
        zope_i18n_compile_mo_files: 'true'
    steps:
    - name: OS packages
      run:
        sudo apt-get update && sudo apt-get install -y wv poppler-utils pdftohtml gettext
    - name: locale
      # needed for CMFPlone testUnicodeSplitter test on Ubuntu
      run: |
        sudo locale-gen nl_NL@euro
        sudo update-locale
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: Create Chameleon cache dir
      run: |
        mkdir -p "${CHAMELEON_CACHE}"
    - name: Run make test
      run: |
        make test

  testrobot:
    runs-on: ubuntu-latest
    env:
        PYTHONWARNINGS: ignore
        GIT_CLONE_DEPTH: 1
        CHAMELEON_CACHE: 'chameleon_cache'
        zope_i18n_compile_mo_files: 'true'
        ROBOTSUITE_LOGLEVEL: ERROR
        ROBOTSUITE_PREFIX: ONLYROBOT
    steps:
    - name: OS packages
      run:
        sudo apt-get update && sudo apt-get install -y wv poppler-utils pdftohtml gettext
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: Create Chameleon cache dir
      run: |
        mkdir -p "${CHAMELEON_CACHE}"
    - name: Setup robotframework browser
      run: |
        make rfbrowser
    - name: Run make test
      run: |
        make test TEST_ARGS="-t ONLYROBOT --all"

