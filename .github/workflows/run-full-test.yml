name: Run full test suite 3.14

on: push

jobs:
  testproducts:
    name: Products functional 3.14
    uses: ./.github/workflows/full-shared.yml
    with:
      # Note: the ubuntu-latest runners have 4 cpus, so we run tests in parallel.
      test-command: make test TEST_ARGS='-f -j 4 -m Products'

  testploneapp:
    name: plone.app functional 3.14
    uses: ./.github/workflows/full-shared.yml
    with:
      test-command: make test TEST_ARGS='-f -j 4 -m plone.app'

  testother:
    name: other functional 3.14
    uses: ./.github/workflows/full-shared.yml
    with:
      test-command: make test TEST_ARGS='-f -j 4 -m !Products -m !plone.app'

  testall:
    # We should either use this one, or the three above.
    # But we can compare.
    name: all functional 3.14
    uses: ./.github/workflows/full-shared.yml
    with:
      test-command: make test TEST_ARGS='-f -j 4'

  testrobot:
    name: Robots 3.14
    uses: ./.github/workflows/full-shared.yml
    with:
      prepare-command: make rfbrowser
      test-command: make test TEST_ARGS='-t ONLYROBOT --all'

  testrobotparallel:
    # Run the robot tests in parallel.
    # Probably less stable, but we can try at least once.
    name: Robots parallel 3.14
    uses: ./.github/workflows/full-shared.yml
    with:
      prepare-command: make rfbrowser
      test-command: make test TEST_ARGS='-t ONLYROBOT --all -j 4'
