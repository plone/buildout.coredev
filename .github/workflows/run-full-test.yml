name: Run full test suite 3.14

on: push

jobs:
  testproducts:
    name: ${{ matrix.python-version }} Products functional
    strategy:
      matrix:
        python-version:
        - "3.13"
        - "3.14"
    uses: ./.github/workflows/full-shared.yml
    with:
      python-version: ${{ matrix.python-version }}
      # Note: the ubuntu-latest runners have 4 cpus, so we run tests in parallel.
      test-command: make test TEST_ARGS='-f -j 4 -m Products.CMFPlone.testMigrationTool'
