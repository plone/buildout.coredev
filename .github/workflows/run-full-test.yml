name: Run full test suite
on: push
jobs:
  testfunctional:
    name: ${{ matrix.python-version }} ${{ matrix.module }} functional
    strategy:
      matrix:
        python-version:
        - "3.13"
        - "3.14"
        module:
        - Products.CMFPlone
        - plone.app
        - "!Products -m !plone.app"
    uses: ./.github/workflows/full-shared.yml
    with:
      python-version: ${{ matrix.python-version }}
      # Note: the ubuntu-latest runners have 4 cpus, so we run tests in parallel.
      test-command: make test TEST_ARGS='-f -j 4 -m ${{ matrix.module }}'

  testrobot:
    name: ${{ matrix.python-version }} ${{ matrix.module }} robots
    strategy:
      matrix:
        python-version:
        - "3.13"
        - "3.14"
        module:
        - Products.CMFPlone
        - "!Products.CMFPlone"
    uses: ./.github/workflows/full-shared.yml
    with:
      python-version: ${{ matrix.python-version }}
      prepare-command: make rfbrowser
      # Note: robot tests should not be run in parallel.
      test-command: make test TEST_ARGS='-t ONLYROBOT --all -m ${{ matrix.module}}'
