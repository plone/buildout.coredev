name: Run full test suite 3.14

on: push

jobs:
  testall:
    runs-on: ubuntu-latest
    env:
        PYTHONWARNINGS: ignore
        GIT_CLONE_DEPTH: 1
    steps:
    - name: locale
      # needed for CMFPlone testUnicodeSplitter test
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo locale-gen nl_NL@euro
        sudo update-locale
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: Run make test
      run: |
        make test

  testrobot:
    runs-on: ubuntu-latest
    env:
        PYTHONWARNINGS: ignore
        GIT_CLONE_DEPTH: 1
        ROBOTSUITE_PREFIX: ONLYROBOT
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: Setup robotframework browser
      run: |
        .venv/bin/rfbrowser init
    - name: Run make test
      run: |
        make test TEST_ARGS="-t ONLYROBOT --all"

