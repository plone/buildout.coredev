name: Running Buildout

on: push

jobs:
  build:
    strategy:
      matrix:
        python-version:
        - "3.12"
        os:
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Run make test
      run: |
        GIT_CLONE_DEPTH=1 make test
