[buildout]
# See https://github.com/plone/Products.CMFPlone/issues/2966
extends = plipbase.cfg
auto-checkout +=
    plone.app.discussion
    plone.base
    plone.restapi
    Products.CMFPlone

[sources]
plone.base = git ${remotes:plone}/plone.base.git pushurl=${remotes:plone_push}/plone.base.git branch=plip-recyclebin-interface
plone.app.discussion = git ${remotes:plone}/plone.app.discussion.git pushurl=${remotes:plone_push}/plone.app.discussion.git branch=plip-recyclebin-discussion
plone.restapi = git ${remotes:plone}/plone.restapi.git pushurl=${remotes:plone_push}/plone.restapi.git branch=rohnsha0-feat-recyclebin-api
Products.CMFPlone = git ${remotes:plone}/Products.CMFPlone.git pushurl=${remotes:plone_push}/Products.CMFPlone.git branch=rohnsha0-plip-recyclebin
